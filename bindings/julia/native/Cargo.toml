[workspace]
resolver = "3"

[package]
name = "holidays-ru-julia"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/hexqnt/holidays-ru"
description = "Native jlrs module for the HolidaysRu Julia package."

[lib]
name = "holidays_ru_julia"
crate-type = ["cdylib"]

[dependencies]
holidays-ru = { path = "../../..", version = "0.2.1" }
holidays-ru-bindings-common = { path = "../../common" }
jlrs = { version = "0.23.0", default-features = false, features = ["ccall"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
