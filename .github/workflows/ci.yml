name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests with all features
        run: cargo test --workspace --all-features --locked

      - name: Tests without features
        run: cargo test --workspace --no-default-features --locked

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  python:
    name: Python bindings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build and install Python package
        working-directory: bindings/python
        run: python -m pip install ".[test]"

      - name: Python tests
        run: python -m pytest bindings/python/tests

      - name: Python types
        working-directory: bindings/python
        run: python -m mypy

      - name: Python lint and format
        working-directory: bindings/python
        run: python -m ruff check . && python -m ruff format --check .
